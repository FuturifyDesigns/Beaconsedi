<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#dc2626" />
<title>Offline — BEACON SEDI EMERGENCY APP</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; font-family: system-ui, -apple-system, sans-serif; background: #0b0f17; color: #f8fafc; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; text-align: center; }
  h1 { font-size: 20px; letter-spacing: .04em; margin: 16px 0 4px; }
  p { color: #94a3b8; margin: 4px 0; font-size: 14px; max-width: 360px; }
  .call { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 28px 0 12px; width: 100%; max-width: 360px; min-height: 96px; border-radius: 20px; background: #dc2626; color: #fff; font-size: 26px; font-weight: 800; text-decoration: none; text-transform: uppercase; box-shadow: 0 10px 40px rgba(220,38,38,.45); }
  .alt { display: block; margin: 8px 0; color: #fca5a5; font-weight: 600; text-decoration: none; }
  button { margin-top: 24px; background: transparent; color: #cbd5e1; border: 1px solid #334155; border-radius: 12px; padding: 10px 18px; font-size: 14px; }
</style>
</head>
<body>
  <h1>BEACON SEDI EMERGENCY APP</h1>
  <p>You are offline. Live SOS and maps need internet, but phone calls still work.</p>
  <a class="call" href="tel:997" onclick="navigator.vibrate&&navigator.vibrate([40,60,40])">📞 Call 997</a>
  <p>Ambulance · Police · Fire — Botswana emergency line</p>
  <a class="alt" href="tel:112">Or call 112 (mobile emergency)</a>
  <button onclick="location.reload()">Try again</button>
</body>
</html>
